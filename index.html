<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andiamo al cinema? — Milano</title>
  <meta name="description" content="La programmazione dei cinema di Milano resa semplice. Orari, zone e versioni originali in un colpo d'occhio.">
  <!-- Open Graph (for WhatsApp / social sharing) -->
  <meta property="og:title" content="Andiamo al cinema? — Milano">
  <meta property="og:description" content="Tutti gli orari dei cinema di Milano, aggiornati ogni settimana.">
  <meta property="og:type" content="website">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-title">Andiamo <em>al cinema?</em></div>
    <div class="brand-sub">La programmazione dei cinema di Milano resa semplice.</div>
  </div>
  <div class="search-wrap">
    <span class="s-ico">&#9906;</span>
    <input type="text" id="searchInput" placeholder="Film, cinema, zona..." autocomplete="off">
    <button id="searchClear" onclick="clearSearch()" style="display:none;position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:none;cursor:pointer;color:var(--faint);font-size:14px;padding:0;line-height:1">&#10005;</button>
  </div>
  <div class="date-nav">
    <button class="dbt active" data-r="today"   onclick="setRange('today')">Oggi</button>
    <button class="dbt"        data-r="weekend" onclick="setRange('weekend')">Weekend</button>
    <button class="dbt"        data-r="week"    onclick="setRange('week')">Settimana</button>
  </div>
</header>

<div class="page">
  <div class="chip-row">
    <button class="chip" id="staseraChip" onclick="quickAction('tonight')">&#127769; Stasera</button>
    <button class="chip" id="ovChip" onclick="quickAction('ov')">&#127760; Versione originale</button>
  </div>

  <div class="filters">
    <div class="filter-row">
      <span class="filter-label">🎬 Cinema</span>
      <select id="cinemaSelect" style="height:32px;padding:0 28px 0 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:13px;font-family:inherit;color:var(--muted);cursor:pointer;appearance:none;background-image:url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2210%22 height=%226%22><path d=%22M0 0l5 6 5-6z%22 fill=%22%239e9b94%22/></svg>');background-repeat:no-repeat;background-position:right 10px center;min-width:220px;max-width:320px"></select>
    </div>
    <div class="filter-row">
      <span class="filter-label">Zona</span>
      <div id="areaChips" style="display:flex;gap:5px;flex-wrap:wrap"></div>
    </div>
    <div class="filter-row">
      <span class="filter-label">Genere</span>
      <div id="genreChips" style="display:flex;gap:5px;flex-wrap:wrap"></div>
    </div>
  </div>

  <div class="top-bar">
    <span class="status-text" id="statusText"></span>
    <span style="font-size:12px;color:var(--faint);font-weight:500;letter-spacing:.04em;text-transform:uppercase">Mostra</span><div class="tab-row">
      <button class="tbt active" id="tFilm"   onclick="setTab('film')">Film</button>
      <button class="tbt"        id="tCinema" onclick="setTab('cinema')">Cinema</button>
    </div>
  </div>

  <div id="dayStripWrap" style="display:none">
    <div class="day-strip-wrap"><div class="day-strip" id="dayStrip"></div></div>
  </div>
  <div id="mainContent"></div>
</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">&#10005;</button>
    <div id="modalInner"></div>
  </div>
</div>

<!-- Modal -->
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">&#10005;</button>
    <div id="modalInner"></div>
  </div>
</div>

<!-- Footer -->
<div style="text-align:center;padding:2rem 1rem 1.5rem;font-size:11.5px;color:var(--faint);line-height:1.9">
  Aggiornato: <span id="updated-date">—</span> &nbsp;·&nbsp; Dati indicativi, verifica sul sito del cinema<br>
  <span style="display:inline-flex;align-items:center;gap:5px;justify-content:center">
    Poster e informazioni sui film forniti da
    <a href="https://www.themoviedb.org" target="_blank" rel="noopener"
       style="display:inline-flex;align-items:center;gap:4px;color:var(--muted);text-decoration:none;font-weight:500">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="flex-shrink:0">
        <rect width="24" height="24" rx="4" fill="#01b4e4"/>
        <text x="4" y="17" font-size="11" font-weight="700" fill="white" font-family="sans-serif">T</text>
      </svg>
      The Movie Database (TMDB)
    </a>
  </span>
</div>

<script src="app.js"></script>
</body>
</html>
